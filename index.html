<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная карта — MapGenie DarkRP Style</title>
    <style>
        :root {
            --bg-color: #121213;
            --sidebar-bg: #1a1a1b;
            --card-bg: #262627;
            --text-color: #f5f5f7;
            --border-color: #333335;
            --accent-color: #0071e3;
            --danger-color: #ff3b30;
            --success-color: #34c759;
            --sidebar-width: 380px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; user-select: none; }

        /* Красивый темный скроллбар для сайдбара */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--sidebar-bg); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        #sidebar { 
            width: var(--sidebar-width); 
            background: var(--sidebar-bg); 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            z-index: 10; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        body.sidebar-collapsed #sidebar {
            transform: translateX(-100%);
            position: absolute;
            height: 100%;
        }

        #sidebar-toggle {
            position: absolute;
            right: -24px;
            top: 20px;
            width: 24px;
            height: 40px;
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-left: none;
            border-radius: 0 8px 8px 0;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 11;
            box-shadow: 4px 0 10px rgba(0,0,0,0.3);
        }
        #sidebar-toggle:hover { color: white; }

        #map-viewport { flex: 1; position: relative; overflow: hidden; cursor: grab; background: #0b0b0c; }
        #map-viewport.adding-mode { cursor: crosshair; }
        #map-viewport:active { cursor: grabbing; }

        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: 2048px; height: 2048px; will-change: transform; }
        .map-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background-size: contain; background-repeat: no-repeat; }
        .map-layer.active { display: block; }

        .panel-section { padding: 15px; border-bottom: 1px solid var(--border-color); }
        .panel-section h4 { margin-bottom: 8px; color: #ffcc00; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; display: flex; justify-content: space-between; align-items: center;}
        
        .search-wrapper { padding: 12px 15px; border-bottom: 1px solid var(--border-color); background: #151516; }
        .search-input { width: 100%; padding: 10px 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; font-size: 14px; }
        .search-input:focus { border-color: var(--accent-color); outline: none; }

        .mode-selector { display: flex; background: #151516; padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 10px; }
        .mode-tab { flex: 1; text-align: center; padding: 8px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; color: #888; transition: all 0.2s; }
        .mode-tab.active { background: var(--card-bg); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .mode-tab.edit-active.active { color: #ffcc00; border: 1px solid rgba(255,204,0,0.2); }

        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); cursor: pointer; border-radius: 6px; font-size: 12px; font-weight: 600; transition: background 0.2s; }
        .tab-btn.active { background: var(--accent-color); border-color: var(--accent-color); }

        .btn { display: inline-block; width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center; font-size: 14px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn.secondary { background: #444446; }
        .btn.active-mode { background: var(--success-color); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .bulk-actions { font-size: 11px; color: var(--accent-color); cursor: pointer; text-transform: none; font-weight: normal; user-select: none; }
        .bulk-actions:hover { text-decoration: underline; }

        .legend-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; font-size: 12px; line-height: 1.4; color: #ccc; }
        .legend-color { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; margin-top: 2px; }

        .marker-wrapper { position: absolute; transform: translate(-50%, -50%); z-index: 5; }
        .marker-icon { display: flex; align-items: center; justify-content: center; background: rgba(20, 20, 20, 0.95); border: 2px solid #fff; color: white; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: border-color 0.2s, transform 0.1s; }
        .marker-icon:hover { transform: scale(1.1); }
        .marker-wrapper.selected-marker .marker-icon { border-color: var(--success-color); box-shadow: 0 0 15px var(--success-color); transform: scale(1.1); }
        
        .zone-shape { position: absolute; pointer-events: none; opacity: 0.35; border: 2px dashed rgba(255,255,255,0.5); transition: opacity 0.2s; }

        .handle { position: absolute; width: 14px; height: 14px; background: #fff; border: 3px solid var(--accent-color); border-radius: 50%; z-index: 100; cursor: pointer; display: none; }
        body.edit-mode .marker-wrapper.selected-marker .handle { display: block; }

        .filter-group { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
        .filter-btn { padding: 5px 8px; font-size: 11px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--card-bg); color: #ccc; cursor: pointer; transition: all 0.15s; }
        .filter-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        /* HUD Блок управления положением */
        #hud-controls { position: absolute; bottom: 15px; right: 15px; display: flex; gap: 8px; align-items: center; z-index: 100; pointer-events: none; }
        #reset-view-btn { background: rgba(15,15,16,0.9); border: 1px solid var(--border-color); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; pointer-events: auto; backdrop-filter: blur(4px); font-weight: 600; }
        #reset-view-btn:hover { background: var(--card-bg); border-color: #555; }
        #coords-hud { background: rgba(15,15,16,0.85); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); font-family: monospace; font-size: 12px; color: #aaa; backdrop-filter: blur(4px); }

        .custom-tooltip { position: absolute; background: rgba(10,10,10,0.95); color: white; padding: 12px; border-radius: 8px; font-size: 12px; z-index: 1000; pointer-events: none; display: none; max-width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); border: 1px solid #444; }
        .tooltip-tag { display: block; padding: 4px 6px; border-radius: 4px; font-size: 11px; margin-top: 6px; font-weight: bold; line-height: 1.3; }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal { background: var(--sidebar-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 20px; border-radius: 12px; width: 420px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #aaa; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: white; border-radius: 6px; font-size: 14px; }
        
        .marker-list { flex: 1; overflow-y: auto; padding: 10px; }
        .marker-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: var(--card-bg); border-radius: 6px; margin-bottom: 6px; border: 1px solid var(--border-color); font-size: 13px; cursor: pointer; transition: background 0.15s; }
        .marker-item:hover { background: #2e2e30; }
        .marker-item.active-item { border-color: var(--success-color); background: #16261a; }
        .actions-btns { display: flex; gap: 6px; }
        .action-icon { cursor: pointer; background: none; border: none; font-size: 15px; color: #aaa; padding: 2px; }
        .action-icon:hover { color: white; }
    </style>
</head>
<body>

    <div id="sidebar">
        <button id="sidebar-toggle" onclick="toggleSidebar()">◀</button>

        <div class="search-wrapper">
            <input type="text" id="search-bar" class="search-input" placeholder="🔍 Поиск ориентира или зоны..." oninput="handleSearch()">
        </div>

        <div class="panel-section">
            <div class="mode-selector">
                <div class="mode-tab active" id="mode-view" onclick="setAppMode('view')">👁️ Просмотр</div>
                <div class="mode-tab" id="mode-edit" onclick="setAppMode('edit')">🛠️ Редактор</div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="btn-map-main" onclick="switchMap('main')">Общая</button>
                <button class="tab-btn" id="btn-map-build" onclick="switchMap('build')">Строительство</button>
                <button class="tab-btn" id="btn-map-crime" onclick="switchMap('crime')">Криминал</button>
            </div>
            <button id="add-btn" class="btn" onclick="toggleAddMode()" style="display: none; margin-top: 5px;">➕ Поставить метку</button>
        </div>

        <div class="panel-section" id="legend-container" style="max-height: 200px; overflow-y: auto;"></div>

        <div class="panel-section">
            <h4>Фильтры Строительства <span class="bulk-actions" onclick="bulkFilters('build')">Вкл/Выкл все</span></h4>
            <div class="filter-group" id="build-filters"></div>
            <h4 style="margin-top:12px;">Фильтры Криминала <span class="bulk-actions" onclick="bulkFilters('crime')">Вкл/Выкл все</span></h4>
            <div class="filter-group" id="crime-filters"></div>
        </div>

        <div class="marker-list" id="markers-registry"></div>

        <div id="editor-footer" class="panel-section" style="border-top: 1px solid var(--border-color); display:none; flex-wrap:wrap; gap:5px; background: #151516;">
            <button class="btn secondary" style="width:48%; margin:0;" onclick="exportJSON()">Экспорт</button>
            <button class="btn secondary" style="width:48%; margin:0;" onclick="document.getElementById('import-file').click()">Импорт</button>
            <input type="file" id="import-file" style="display:none" onchange="importJSON(this)">
            <button class="btn" style="background:var(--success-color); margin:5px 0 0 0;" onclick="bakeHTML()">💾 Сделать базовыми</button>
        </div>
    </div>

    <div id="map-viewport" onmousedown="startPan(event)" onmousemove="doPan(event)" onmouseup="endPan(event)" onmouseleave="endPan(event)" oncontextmenu="handleRightClick(event)">
        <div id="map-container">
            <div id="layer-main" class="map-layer active" style="background-image: url('map_main.png');"></div>
            <div id="layer-build" class="map-layer" style="background-image: url('map_build.png');"></div>
            <div id="layer-crime" class="map-layer" style="background-image: url('map_crime.png');"></div>
            
            <div id="dynamic-elements"></div>
        </div>
        
        <div id="hud-controls">
            <button id="reset-view-btn" onclick="resetView()">🎯 Сбросить вид</button>
            <div id="coords-hud">X: 0 | Y: 0</div>
        </div>
    </div>

    <div class="custom-tooltip" id="tooltip"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3 id="modal-title" style="margin-bottom:15px;">Параметры точки</h3>
            <input type="hidden" id="form-id">
            <input type="hidden" id="form-x">
            <input type="hidden" id="form-y">

            <div class="form-group">
                <label>Название ориентира</label>
                <input type="text" id="form-name" placeholder="Введи название сам...">
            </div>
            <div class="form-group">
                <label>Описание / Примечание</label>
                <textarea id="form-desc" rows="3" placeholder="Что тут находится..."></textarea>
            </div>
            <div class="form-group">
                <label>Тип маркера</label>
                <select id="form-type"></select>
            </div>
            <div class="form-group">
                <label>Размер значка</label>
                <input type="range" id="form-size" min="24" max="56" value="32">
            </div>
            <div class="form-group">
                <label>Зона строительства (Правило)</label>
                <select id="form-tag-build"></select>
            </div>
            <div class="form-group">
                <label>Криминальный статус зоны</label>
                <select id="form-tag-crime"></select>
            </div>
            <div class="form-group" style="border-top:1px solid var(--border-color); padding-top:10px;">
                <label>Отображение границ зоны</label>
                <select id="form-zone-type" onchange="toggleModalZoneFields()">
                    <option value="none">Без отображения границ</option>
                    <option value="circle">Круглая зона</option>
                    <option value="rect">Прямоугольная зона</option>
                </select>
            </div>
            <div id="modal-zone-details" style="display:none;">
                <div class="form-group">
                    <label>Цвет заливки границ</label>
                    <input type="color" id="form-zone-color" value="#ff0000">
                </div>
                <div class="form-group">
                    <label>Прозрачность зоны</label>
                    <input type="range" id="form-zone-opacity" min="0.1" max="0.8" step="0.05" value="0.3">
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn secondary" style="margin:0;" onclick="closeModal()">Отмена</button>
                <button class="btn" style="margin:0; flex:1;" onclick="saveMarker()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_MARKERS = [];

        const ICONS = {
            "Вокзал": "🚉", "Поляна": "🌿", "Парк": "🌳", "Фонтан": "⛲", "ПУ": "👮", 
            "Гараж": "🚗", "Многоэтажка": "🏢", "Заброшка": "🏚️", "Клуб": "🎵", 
            "Люк/канализация": "🕳️", "Цемент": "🧱", "Точка захвата банд": "⚔️", 
            "Закоулок/Переулок": "🚪", "Подземный переход": "🚇", "Амбрела": "☣️", 
            "Лаборатория": "🧪", "Елитка": "💎", "Проезд": "🛣️", "Водоканал": "💧", 
            "Скупщик наркотиков": "💉", "Бочка Амбрелы": "🛢️", "Графити": "🎨"
        };

        const BUILD_TAGS = {
            "unmarked": { text: "Серая зона (Не помечено — разрешены мелкие постройки)", color: "#555558" },
            "red": { text: "Красная зона (Дороги/Спавн. Строить запрещено)", color: "#ff3b30" },
            "green": { text: "Зеленая зона (Общая доступность. Не занимать в соло)", color: "#34c759" },
            "blue": { text: "Синяя зона (Только госструктуры с разрешения власти)", color: "#0071e3" },
            "turquoise": { text: "Бирюзовая зона (Придомовая. Только владельцам)", color: "#30b0c7" },
            "pink": { text: "Розовая зона (Главные улицы. 10 мин инактива = снос)", color: "#ff2d55" },
            "yellow": { text: "Желтая зона (Элитный квартал. Только жильцам)", color: "#ffcc00" },
            "purple": { text: "Фиолетовая зона (Зона Umbrella Corporation)", color: "#af52de" }
        };

        const CRIME_TAGS = {
            "unmarked": { text: "Серая зона (Криминал разрешен сугубо БЕЗ свидетелей)", color: "#777" },
            "blue": { text: "Синяя зона (Общественные места. Криминал ЗАПРЕЩЕН)", color: "#0071e3" },
            "yellow": { text: "Желтая зона (Опасный район/Гетто. Разрешено всегда)", color: "#ffcc00" }
        };

        let markers = JSON.parse(localStorage.getItem('gmod_rp_markers')) || [...BASE_MARKERS];
        let currentMap = 'main';
        let appMode = 'view';
        let isAddMode = false;
        let activeMarkerId = null;
        let searchQuery = "";

        // Позиционирование карты по умолчанию
        let scale = 0.4, panX = 100, panY = 100;
        let isPanning = false, startX, startY;
        let initMouseX = 0, initMouseY = 0; // Для отслеживания чистых кликов без сдвига

        let activeBuildFilters = [];
        let activeCrimeFilters = [];

        window.onload = function() {
            initDropdowns();
            renderLegend();
            renderFilters();
            resetView(); // Ставим карту красиво при первой загрузке
            renderMarkers();

            const viewport = document.getElementById('map-viewport');
            const container = document.getElementById('map-container');
            const hud = document.getElementById('coords-hud');
            
            viewport.addEventListener('mousemove', function(e) {
                const rect = container.getBoundingClientRect();
                const x = Math.round((e.clientX - rect.left) / scale);
                const y = Math.round((e.clientY - rect.top) / scale);
                if(x >= 0 && x <= 2048 && y >= 0 && y <= 2048) {
                    hud.innerText = `X: ${x} | Y: ${y}`;
                }
            });

            viewport.addEventListener('wheel', function(e) {
                e.preventDefault();
                const zoom = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                let newScale = scale * zoom;
                newScale = Math.max(0.15, Math.min(newScale, 4));
                const rect = this.getBoundingClientRect();
                const mX = e.clientX - rect.left; const mY = e.clientY - rect.top;
                panX = mX - (mX - panX) * (newScale / scale);
                panY = mY - (mY - panY) * (newScale / scale);
                scale = newScale;
                applyTransform();
            }, { passive: false });
        };

        function resetView() {
            const viewport = document.getElementById('map-viewport');
            const vRect = viewport.getBoundingClientRect();
            scale = Math.min(vRect.width, vRect.height) / 2100;
            if(scale < 0.2) scale = 0.3;
            panX = (vRect.width - (2048 * scale)) / 2;
            panY = (vRect.height - (2048 * scale)) / 2;
            applyTransform();
        }

        function setAppMode(mode) {
            appMode = mode;
            document.getElementById('mode-view').classList.toggle('active', mode === 'view');
            document.getElementById('mode-edit').classList.toggle('active', mode === 'edit');
            document.getElementById('mode-edit').classList.toggle('edit-active', mode === 'edit');
            
            document.body.className = mode === 'edit' ? 'edit-mode' : '';
            document.getElementById('add-btn').style.display = mode === 'edit' ? 'block' : 'none';
            document.getElementById('editor-footer').style.display = mode === 'edit' ? 'flex' : 'none';
            
            if(mode === 'view' && isAddMode) toggleAddMode();
            renderMarkers();
        }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const btn = document.getElementById('sidebar-toggle');
            btn.innerText = document.body.classList.contains('sidebar-collapsed') ? '▶' : '◀';
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-bar').value.toLowerCase();
            renderMarkers();
        }

        function initDropdowns() {
            const tSel = document.getElementById('form-type');
            tSel.innerHTML = '';
            for(let k in ICONS) tSel.innerHTML += `<option value="${k}">${ICONS[k]} ${k}</option>`;
            const bSel = document.getElementById('form-tag-build');
            bSel.innerHTML = '';
            for(let k in BUILD_TAGS) bSel.innerHTML += `<option value="${k}">${BUILD_TAGS[k].text}</option>`;
            const cSel = document.getElementById('form-tag-crime');
            cSel.innerHTML = '';
            for(let k in CRIME_TAGS) cSel.innerHTML += `<option value="${k}">${CRIME_TAGS[k].text}</option>`;
        }

        function renderLegend() {
            const container = document.getElementById('legend-container');
            container.innerHTML = '';
            if (currentMap === 'build') {
                container.innerHTML = '<h4>Правила Строительства</h4>';
                for(let k in BUILD_TAGS) container.innerHTML += `<div class="legend-item"><div class="legend-color" style="background:${BUILD_TAGS[k].color}"></div><span>${BUILD_TAGS[k].text}</span></div>`;
            } else if (currentMap === 'crime') {
                container.innerHTML = '<h4>Криминальный регламент</h4>';
                for(let k in CRIME_TAGS) container.innerHTML += `<div class="legend-item"><div class="legend-color" style="background:${CRIME_TAGS[k].color}"></div><span>${CRIME_TAGS[k].text}</span></div>`;
            } else {
                container.innerHTML = '<h4>Общая карта</h4><p style="font-size:12px; color:#888;">Кликни по маркеру на карте или в списке, чтобы отобразить его границы и правила.</p>';
            }
        }

        function renderFilters() {
            const bf = document.getElementById('build-filters'); bf.innerHTML = '';
            for(let k in BUILD_TAGS) bf.innerHTML += `<button class="filter-btn" id="fb-${k}" onclick="toggleFilter('build','${k}')">${k === 'unmarked' ? 'СЕРАЯ' : k.toUpperCase()}</button>`;
            const cf = document.getElementById('crime-filters'); cf.innerHTML = '';
            for(let k in CRIME_TAGS) cf.innerHTML += `<button class="filter-btn" id="fc-${k}" onclick="toggleFilter('crime','${k}')">${k === 'unmarked' ? 'СЕРАЯ КРИМ' : 'КРИМ: ' + k.toUpperCase()}</button>`;
        }

        function bulkFilters(type) {
            const keys = type === 'build' ? Object.keys(BUILD_TAGS) : Object.keys(CRIME_TAGS);
            const targetArr = type === 'build' ? activeBuildFilters : activeCrimeFilters;
            
            if(targetArr.length === keys.length) {
                targetArr.length = 0;
            } else {
                targetArr.length = 0; keys.forEach(k => targetArr.push(k));
            }
            keys.forEach(k => {
                const el = document.getElementById(type === 'build' ? `fb-${k}` : `fc-${k}`);
                el.classList.toggle('active', targetArr.includes(k));
            });
            renderMarkers();
        }

        function toggleFilter(type, key) {
            let arr = type === 'build' ? activeBuildFilters : activeCrimeFilters;
            let idx = arr.indexOf(key);
            if (idx > -1) arr.splice(idx, 1); else arr.push(key);
            document.getElementById(type === 'build' ? `fb-${key}` : `fc-${key}`).classList.toggle('active');
            renderMarkers();
        }

        function switchMap(mapId) {
            currentMap = mapId;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.map-layer').forEach(l => l.classList.remove('active'));
            document.getElementById(`btn-map-${mapId}`).classList.add('active');
            document.getElementById(`layer-${mapId}`).classList.add('active');
            renderLegend();
        }

        function handleRightClick(e) {
            if(appMode !== 'edit') return;
            e.preventDefault();
            const rect = document.getElementById('map-container').getBoundingClientRect();
            const x = (e.clientX - rect.left) / scale;
            const y = (e.clientY - rect.top) / scale;
            openModal(x, y);
        }

        function startPan(e) {
            if (isAddMode) {
                const rect = document.getElementById('map-container').getBoundingClientRect();
                openModal((e.clientX - rect.left) / scale, (e.clientY - rect.top) / scale);
                return;
            }
            if (e.target.closest('.marker-icon') || e.target.closest('.handle') || e.target.closest('#hud-controls')) return;
            
            isPanning = true; 
            initMouseX = e.clientX; 
            initMouseY = e.clientY;
            startX = e.clientX - panX; 
            startY = e.clientY - panY;
        }

        function doPan(e) { 
            if(isPanning) { 
                panX = e.clientX - startX; 
                panY = e.clientY - startY; 
                applyTransform(); 
            } 
        }
        
        function endPan(e) { 
            if (isPanning) {
                isPanning = false;
                // Различаем клик и перетягивание. Если сдвиг мыши мелкий — это просто сброс фокуса
                let moveDist = Math.hypot(e.clientX - initMouseX, e.clientY - initMouseY);
                if (moveDist < 4) {
                    activeMarkerId = null;
                    renderMarkers();
                }
            }
        }
        
        function applyTransform() { 
            document.getElementById('map-container').style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; 
        }

        function toggleAddMode() {
            isAddMode = !isAddMode;
            const btn = document.getElementById('add-btn');
            btn.classList.toggle('active-mode', isAddMode);
            btn.innerText = isAddMode ? '🛑 Кликни по карте' : '➕ Поставить метку';
            document.getElementById('map-viewport').classList.toggle('adding-mode', isAddMode);
        }

        function toggleSelectMarker(id, forceFocus = false) {
            if (activeMarkerId === id && !forceFocus) {
                activeMarkerId = null;
            } else {
                activeMarkerId = id;
                if (forceFocus) {
                    const m = markers.find(x => x.id === id);
                    if (m) focusOnMarker(m);
                }
            }
            renderMarkers();
        }

        // Центрирование карты на выбранный ориентир
        function focusOnMarker(m) {
            const viewport = document.getElementById('map-viewport');
            const vRect = viewport.getBoundingClientRect();
            scale = Math.max(scale, 0.75); // Приближаем для информативности, если зум мелкий
            panX = (vRect.width / 2) - (m.x * scale);
            panY = (vRect.height / 2) - (m.y * scale);
            applyTransform();
        }

        function renderMarkers() {
            const root = document.getElementById('dynamic-elements');
            const registry = document.getElementById('markers-registry');
            root.innerHTML = ''; registry.innerHTML = '';

            markers.forEach(m => {
                if (activeBuildFilters.length > 0 && !activeBuildFilters.includes(m.tagBuild)) return;
                if (activeCrimeFilters.length > 0 && !activeCrimeFilters.includes(m.tagCrime)) return;
                if (searchQuery && !m.name.toLowerCase().includes(searchQuery) && !m.desc.toLowerCase().includes(searchQuery)) return;

                const isSelected = (activeMarkerId === m.id);

                let zoneHtml = '';
                if (m.zone && m.zone.type !== 'none' && isSelected) {
                    let style = `background:${m.zone.color}; opacity:${m.zone.opacity};`;
                    if (m.zone.type === 'circle') {
                        style += `left:${m.x}px; top:${m.y}px; width:${m.zone.radius*2}px; height:${m.zone.radius*2}px; border-radius:50%; transform: translate(-50%, -50%);`;
                    } else if (m.zone.type === 'rect') {
                        style += `left:${m.x + m.zone.left}px; top:${m.y + m.zone.top}px; width:${m.zone.right - m.zone.left}px; height:${m.zone.bottom - m.zone.top}px; transform: none;`;
                    }
                    zoneHtml = `<div class="zone-shape" id="zone-${m.id}" style="${style}"></div>`;
                }

                const wrapper = document.createElement('div');
                wrapper.className = `marker-wrapper ${isSelected ? 'selected-marker' : ''}`;
                wrapper.style.left = m.x + 'px'; wrapper.style.top = m.y + 'px';
                wrapper.id = `wrapper-${m.id}`;

                let handles = '';
                if (isSelected && appMode === 'edit') {
                    if (m.zone.type === 'circle') {
                        handles += `<div class="handle" style="left:calc(50% + ${m.zone.radius}px); top:50%; transform:translate(-50%,-50%);" onmousedown="startResizeCircle(event, '${m.id}')"></div>`;
                    } else if (m.zone.type === 'rect') {
                        const cH = (m.zone.top + m.zone.bottom) / 2, cW = (m.zone.left + m.zone.right) / 2;
                        handles += `<div class="handle" style="left:calc(50% + ${m.zone.left}px); top:calc(50% + ${cH}px); transform:translate(-50%,-50%); cursor:ew-resize;" onmousedown="startResizeRectEdge(event, '${m.id}', 'left')"></div>`;
                        handles += `<div class="handle" style="left:calc(50% + ${m.zone.right}px); top:calc(50% + ${cH}px); transform:translate(-50%,-50%); cursor:ew-resize;" onmousedown="startResizeRectEdge(event, '${m.id}', 'right')"></div>`;
                        handles += `<div class="handle" style="left:calc(50% + ${cW}px); top:calc(50% + ${m.zone.top}px); transform:translate(-50%,-50%); cursor:ns-resize;" onmousedown="startResizeRectEdge(event, '${m.id}', 'top')"></div>`;
                        handles += `<div class="handle" style="left:calc(50% + ${cW}px); top:calc(50% + ${m.zone.bottom}px); transform:translate(-50%,-50%); cursor:ns-resize;" onmousedown="startResizeRectEdge(event, '${m.id}', 'bottom')"></div>`;
                    }
                }

                wrapper.innerHTML = `
                    <div class="marker-icon" style="width:${m.size}px; height:${m.size}px; font-size:${m.size*0.55}px;"
                         onmousedown="startMoveMarker(event, '${m.id}')"
                         onmouseenter="showTooltip(event, '${m.id}')" onmouseleave="hideTooltip()">
                        ${ICONS[m.type] || '📍'}
                    </div>
                    ${handles}
                `;

                if(zoneHtml) {
                    const t = document.createElement('div'); t.innerHTML = zoneHtml; root.appendChild(t.firstChild);
                }
                root.appendChild(wrapper);

                let actionControls = `<button class="action-icon" title="Показать границы">📐</button>`;
                if (appMode === 'edit') {
                    actionControls = `
                        <button class="action-icon" title="Редактировать параметры" onclick="event.stopPropagation(); openModalForEdit('${m.id}')">✏️</button>
                        <button class="action-icon" style="color:var(--danger-color);" onclick="event.stopPropagation(); deleteMarker('${m.id}')">🗑️</button>
                    `;
                }

                registry.innerHTML += `
                    <div class="marker-item ${isSelected ? 'active-item' : ''}" onclick="toggleSelectMarker('${m.id}', true)">
                        <span>${ICONS[m.type]} <b>${m.name}</b></span>
                        <div class="actions-btns">${actionControls}</div>
                    </div>`;
            });
        }

        function startMoveMarker(e, id) {
            e.stopPropagation();
            const m = markers.find(x => x.id === id);
            let dragMouseX = e.clientX, dragMouseY = e.clientY, isDragged = false;

            if (appMode !== 'edit') {
                toggleSelectMarker(id, false);
                return;
            }

            function move(ev) {
                if (Math.abs(ev.clientX - e.clientX) > 3 || Math.abs(ev.clientY - e.clientY) > 3) isDragged = true;
                const dx = (ev.clientX - dragMouseX) / scale, dy = (ev.clientY - dragMouseY) / scale;
                
                // Ограничиваем перемещение размерами холста карты
                m.x = Math.max(0, Math.min(2048, m.x + dx));
                m.y = Math.max(0, Math.min(2048, m.y + dy));
                
                dragMouseX = ev.clientX; dragMouseY = ev.clientY;
                
                document.getElementById(`wrapper-${id}`).style.left = m.x + 'px';
                document.getElementById(`wrapper-${id}`).style.top = m.y + 'px';
                const z = document.getElementById(`zone-${id}`);
                if(z) {
                    if (m.zone.type === 'circle') { z.style.left = m.x + 'px'; z.style.top = m.y + 'px'; }
                    else if (m.zone.type === 'rect') { z.style.left = (m.x + m.zone.left) + 'px'; z.style.top = (m.y + m.zone.top) + 'px'; }
                }
            }
            function stop() { 
                window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); 
                if (!isDragged) toggleSelectMarker(id, false);
                save(); renderMarkers();
            }
            window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        }

        function startResizeCircle(e, id) {
            e.stopPropagation(); if (appMode !== 'edit') return;
            const m = markers.find(x => x.id === id); const container = document.getElementById('map-container');
            function move(ev) {
                const rect = container.getBoundingClientRect();
                m.zone.radius = Math.round(Math.sqrt(Math.pow(((ev.clientX - rect.left)/scale) - m.x, 2) + Math.pow(((ev.clientY - rect.top)/scale) - m.y, 2)));
                renderMarkers();
            }
            function stop() { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); save(); }
            window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        }

        function startResizeRectEdge(e, id, edge) {
            e.stopPropagation(); if (appMode !== 'edit') return;
            const m = markers.find(x => x.id === id); const container = document.getElementById('map-container');
            function move(ev) {
                const rect = container.getBoundingClientRect();
                const rX = ((ev.clientX - rect.left) / scale) - m.x, rY = ((ev.clientY - rect.top) / scale) - m.y;
                if (edge === 'left') m.zone.left = Math.min(m.zone.right - 10, rX);
                else if (edge === 'right') m.zone.right = Math.max(m.zone.left + 10, rX);
                else if (edge === 'top') m.zone.top = Math.min(m.zone.bottom - 10, rY);
                else if (edge === 'bottom') m.zone.bottom = Math.max(m.zone.top + 10, rY);
                renderMarkers();
            }
            function stop() { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); save(); }
            window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        }

        function showTooltip(e, id) {
            const m = markers.find(x => x.id === id); const tt = document.getElementById('tooltip');
            tt.innerHTML = `
                <div style="font-weight:bold; font-size:14px; color:#ffcc00;">${m.name}</div>
                <div style="margin-top:4px; color:#e0e0e0; font-size:11px; white-space: pre-line;">${m.desc || 'Без описания'}</div>
                <span class="tooltip-tag" style="background:${BUILD_TAGS[m.tagBuild].color}; color:#fff;">Строительство: ${BUILD_TAGS[m.tagBuild].text}</span>
                <span class="tooltip-tag" style="background:${CRIME_TAGS[m.tagCrime].color}; color:#fff;">Криминал: ${CRIME_TAGS[m.tagCrime].text}</span>
            `;
            tt.style.display = 'block';
            function track(ev) { 
                tt.style.left = (ev.clientX + 15) + 'px'; 
                tt.style.top = (ev.clientY + 15) + 'px'; 
            }
            e.target.addEventListener('mousemove', track); m._track = track;
        }
        function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

        function openModal(x, y) {
            document.getElementById('modal-title').innerText = 'Новая точка';
            document.getElementById('form-id').value = ''; document.getElementById('form-x').value = x; document.getElementById('form-y').value = y;
            document.getElementById('form-name').value = ''; document.getElementById('form-desc').value = '';
            document.getElementById('form-zone-type').value = 'none'; toggleModalZoneFields();
            document.getElementById('modal').style.display = 'flex'; if(isAddMode) toggleAddMode();
        }

        function openModalForEdit(id) {
            const m = markers.find(x => x.id === id);
            document.getElementById('modal-title').innerText = 'Редактировать параметры';
            document.getElementById('form-id').value = m.id; document.getElementById('form-name').value = m.name;
            document.getElementById('form-desc').value = m.desc; document.getElementById('form-type').value = m.type;
            document.getElementById('form-size').value = m.size; document.getElementById('form-tag-build').value = m.tagBuild;
            document.getElementById('form-tag-crime').value = m.tagCrime; document.getElementById('form-zone-type').value = m.zone ? m.zone.type : 'none';
            if(m.zone) { document.getElementById('form-zone-color').value = m.zone.color; document.getElementById('form-zone-opacity').value = m.zone.opacity; }
            toggleModalZoneFields(); document.getElementById('modal').style.display = 'flex';
        }

        function toggleModalZoneFields() {
            document.getElementById('modal-zone-details').style.display = (document.getElementById('form-zone-type').value === 'none') ? 'none' : 'block';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function saveMarker() {
            const id = document.getElementById('form-id').value;
            const name = document.getElementById('form-name').value || 'Безымянный ориентир';
            const desc = document.getElementById('form-desc').value;
            const type = document.getElementById('form-type').value;
            const size = parseInt(document.getElementById('form-size').value);
            const tagBuild = document.getElementById('form-tag-build').value;
            const tagCrime = document.getElementById('form-tag-crime').value;
            const zoneType = document.getElementById('form-zone-type').value;

            let zone = { type: zoneType };
            if (zoneType !== 'none') {
                zone.color = document.getElementById('form-zone-color').value;
                zone.opacity = parseFloat(document.getElementById('form-zone-opacity').value);
                if (id) {
                    const old = markers.find(x => x.id === id);
                    zone.radius = old.zone?.radius || 80;
                    zone.left = old.zone?.left !== undefined ? old.zone.left : -60; zone.right = old.zone?.right !== undefined ? old.zone.right : 60;
                    zone.top = old.zone?.top !== undefined ? old.zone.top : -40; zone.bottom = old.zone?.bottom !== undefined ? old.zone.bottom : 40;
                } else {
                    zone.radius = 80; zone.left = -60; zone.right = 60; zone.top = -40; zone.bottom = 40;
                }
            }

            if (id) {
                let m = markers.find(x => x.id === id);
                m.name = name; m.desc = desc; m.type = type; m.size = size; m.tagBuild = tagBuild; m.tagCrime = tagCrime; m.zone = zone;
            } else {
                const newId = 'm_' + Date.now();
                markers.push({
                    id: newId, x: parseFloat(document.getElementById('form-x').value), y: parseFloat(document.getElementById('form-y').value),
                    name, desc, type, size, tagBuild, tagCrime, zone
                });
                activeMarkerId = newId;
            }
            save(); closeModal(); renderMarkers();
        }

        function deleteMarker(id) {
            if(confirm('Удалить ориентир безвозвратно?')) {
                markers = markers.filter(x => x.id !== id); if(activeMarkerId === id) activeMarkerId = null;
                save(); renderMarkers();
            }
        }

        function save() { localStorage.setItem('gmod_rp_markers', JSON.stringify(markers)); }
        function exportJSON() {
            const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(markers, null, 2));
            const a = document.createElement('a'); a.href = data; a.download = "map_config.json"; a.click();
        }
        function importJSON(input) {
            const file = input.files[0]; if (!file) return;
            const r = new FileReader();
            r.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(Array.isArray(parsed)) { markers = parsed; save(); renderMarkers(); alert('Успешно импортировано!'); }
                } catch(c) { alert('Ошибка чтения файла'); }
            };
            r.readAsText(file);
        }

        function bakeHTML() {
            const current = document.documentElement.outerHTML;
            const pattern = /const BASE_MARKERS = \[\s*\];/;
            const injected = `const BASE_MARKERS = ${JSON.stringify(markers, null, 2)};`;
            let baked = current.replace(pattern, injected);
            const blob = new Blob([baked], {type: "text/html;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = "server_map_release.html"; a.click();
        }
    </script>
</body>
